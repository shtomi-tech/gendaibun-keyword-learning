name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate runtime config
        run: node scripts/write-config.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - name: Check data and logic
        run: |
          node --check static/mode-vocab.js
          node --check static/meaning-guard.js
          node --check static/set-progress.js
          node --check static/srs.js
          node scripts/check-data.mjs
          node scripts/check-set-choices.mjs
          node scripts/check-context-choices.mjs
          node scripts/check-srs.cjs
          node scripts/check-fsrs-vendor.cjs
          node scripts/check-response-time-ui.cjs
          node scripts/check-set-progress.cjs
          node scripts/check-study-plan.cjs
      - name: Prepare static files
        run: |
          mkdir -p _site/static _site/static/vendor/fsrs _site/data
          cp index.html .nojekyll _site/
          cp static/*.js static/*.css static/*.svg static/config.json _site/static/
          # cp static/*.js のグロブはサブディレクトリを拾わない。消すと本番だけ404になる。
          cp static/vendor/fsrs/index.umd.js static/vendor/fsrs/LICENSE _site/static/vendor/fsrs/
          cp data/*.json _site/data/
      - name: Check Cloudflare config
        run: |
          npx --yes wrangler@4.147.0 deploy --dry-run --outdir "$RUNNER_TEMP/wrangler-dry-run"
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: site
          path: _site
          include-hidden-files: true
          retention-days: 1

  # 本番は Cloudflare。GitHub Pages は配布済みの github.io リンク（生徒URL含む）を切らさないため当面並行で残す。
  cloudflare:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency: cloudflare-deploy
    steps:
      - uses: actions/checkout@v4
      - name: Check Cloudflare secrets
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID が未設定のため Cloudflare へはデプロイしません"
          fi
      - uses: actions/download-artifact@v4
        if: steps.cf.outputs.enabled == 'true'
        with:
          name: site
          path: _site
      - name: Deploy to Cloudflare Workers
        if: steps.cf.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.147.0"
          command: deploy

  pages:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
